# Ergo モジュール一覧 (機械処理用)
#
# 人間向けの一覧は module_list.md を参照。新規モジュール追加時は両方に
# エントリを足すこと。tests/test_module_catalog.cmake (ctest
# test_module_catalog) がこのファイルと CMakeLists.txt / include/ergo/ /
# spec/domains/ / tools/ergo/ / README.md / module_list.md の食い違いを検出する。
#
# 書式の約束 (test_module_catalog が YAML パーサを使わずに読むため):
#   - modules[] の各エントリは "  - name: " で始め、キーは 1 行 1 つ
#   - 文字列の値 (summary) は必ず二重引用符で囲む
#   - リストはフロー形式 ([a, b]) で 1 行に書く
#
# schema (modules[].*):
#   name:          CMake ターゲット名 (ergo_*)。Ergo::<名前から ergo_ を除いたもの> の ALIAS もある
#   summary:       1 行概要 (日本語、二重引用符で囲む)
#   category:      UI / ロジック / システム / ゲームオブジェクト
#   domain:        所属する Anatomia ドメイン (spec/domains/<domain>.domain.json)
#   header_dir:    公開ヘッダのルート
#   source_dir:    実装ソースのルート
#   test_dir:      テストソースのルート
#   spec:          モジュール仕様書 (spec/feature/module/ か spec/module/ の実物)
#   cmake_option:  ON/OFF で切り替える CMake オプション (既定・前提は spec/setup/config-reference.md)
#   cxx_standard:  利用側に伝わる C++ 標準 (省略時 17。target_compile_features で伝播)
#   depends:       リンクする ergo_* ターゲット (PUBLIC / PRIVATE を問わず、CMakeLists.txt の
#                  target_link_libraries のとおり。外部ライブラリと Threads は含めない)
#   external:      必須の外部ターゲット (省略時なし。任意の外部 SDK は仕様書を参照)
#   extra_targets: モジュールに付随する追加ターゲット。{name, cmake_option} の列で、
#                  cmake_option が null のものは別スイッチを持たない
#                  (モジュールと一緒に、または外部ターゲットの有無で決まる)。
#                  ERGO_BUILD_DUMMY の ergo_<名>_dummy は載せない
#   tool_plugins:  付随する tools/ergo プラグイン id の列 (無ければ [])
#   status:        stable / preview / incomplete のいずれか
#
# schema (shared_libs[].*): name / summary / header_dir / source_dir / test_dir /
#   spec / extra_targets。モジュールではなく、常にビルドされる下層ライブラリ
#   (ERGO_BUILD_* を持たない)。
#
# schema (excluded[].*): include/ergo/ にディレクトリがあるが一覧に載せないもの。
#   name / reason / ref。

schema_version: 2

# モジュールが使う LUDIARS 製パッケージ (Pictor / Tela / Lapilli ...) の版と
# modules ごとの needs / optional の宣言。形式は spec/data/ergo-packages.md。
package_manifest: ergo-packages.json

excluded:
  - name: ergo_shuriken_migrator
    reason: "Unity Shuriken からの一回きりの移行用。使っているタイトルのツール側へ移してから削除する予定で、それまでは legacy ドメインに置く"
    ref: spec/architecture/domains-and-ux.md §5 L1

modules:
  - name: ergo_input
    summary: "マウス・キーボード・ゲームパッド・USB HID の統一入力レイヤ"
    category: システム
    domain: input
    header_dir: include/ergo/input/
    source_dir: src/input/
    test_dir:   tests/input/
    spec:       spec/feature/module/input.md
    cmake_option: ERGO_BUILD_INPUT
    depends:    []
    tool_plugins: []
    status: preview

  - name: ergo_particle
    summary: "CPU パーティクル sim + (任意) Pictor Vulkan ビルボード renderer。particle プラグインから設定を受け取るフィーダーは別ターゲット ergo_particle_link"
    category: システム
    domain: rendering
    header_dir: include/ergo/particle/
    source_dir: src/particle/
    test_dir:   tests/particle/
    spec:       spec/feature/module/particle.md
    cmake_option: ERGO_BUILD_PARTICLE
    depends:    []
    extra_targets: [{name: ergo_particle_link, cmake_option: ERGO_BUILD_PARTICLE_LINK}]
    tool_plugins: [particle, vfx-suggest, vfx-breed]
    status: stable

  - name: ergo_gpu_particle
    summary: "Shuriken 相当の GPU compute パーティクル (IGpuBackend 抽象)"
    category: システム
    domain: rendering
    header_dir: include/ergo/gpu_particle/
    source_dir: src/gpu_particle/
    test_dir:   tests/gpu_particle/
    spec:       spec/feature/module/gpu_particle.md
    cmake_option: ERGO_BUILD_GPU_PARTICLE
    depends:    []
    tool_plugins: []
    status: preview   # Burst cycles / shape variants が TODO

  - name: ergo_bind
    summary: "任意ホスト変数を WS アウトバウンドで外部エディタに公開"
    category: システム
    domain: observability
    header_dir: include/ergo/bind/
    source_dir: src/bind/
    test_dir:   tests/bind/
    spec:       spec/feature/module/bind.md
    cmake_option: ERGO_BUILD_BIND
    depends:    [ergo_common, ergo_common_ws]
    tool_plugins: [variable]
    status: stable

  - name: ergo_actor
    summary: "シーングラフ基底クラス。ツリーノード自動登録 + Actor 配下に変数を公開 (ergo_bind に委譲)"
    category: システム
