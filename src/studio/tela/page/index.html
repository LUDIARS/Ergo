<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ergo Studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1e23; color: #eceef2; overflow: hidden;
               font-family: system-ui, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #stage { position: absolute; inset: 0; }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #note { position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 4px;
          background: #2e3039; color: #f2bf4d; font-size: 13px; }
</style>
<script src="/shell/tela.js" defer></script>
<script src="/shell/shell.js" defer></script>
</head>
<body>
<div id="stage"><canvas id="screen" tabindex="0"></canvas></div>
<div id="note">Studio に接続しています…</div>
</body>
</html>
