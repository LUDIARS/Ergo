<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VFX Breed</title>
<style>
  :root {
    --bg:#1a1d21; --panel:#23272d; --panel2:#2a2e35; --line:#343a42;
    --text:#e7eaef; --muted:#8a93a0;
    --accent:#7cc4ff; --ok:#7cd47c; --bad:#ff7d7d; --warn:#f5c542;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100%;
               background:var(--bg); color:var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               font-size:14px; }
  #app { max-width:1100px; margin:0 auto; padding:1rem; }
  header { display:flex; align-items:center; gap:.6rem; margin-bottom:1rem; flex-wrap:wrap; }
  header h1 { font-size:1rem; font-weight:600; margin:0; }
  .badge { font-size:.7rem; padding:.2rem .5rem; border-radius:3px;
           border:1px solid var(--line); color:var(--muted); font-family:monospace; }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.bad { color:var(--bad); border-color:var(--bad); }

  fieldset { border:1px solid var(--line); border-radius:6px; padding:.6rem .75rem; margin:0 0 .8rem; }
  legend { color:var(--muted); font-size:.75rem; padding:0 .3rem; }
  .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin:.3rem 0; }
  label { font-size:.8rem; color:var(--muted); display:flex; align-items:center; gap:.35rem; }
  select, input[type=text], input[type=number], textarea {
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:.35rem .55rem; font-size:.82rem;
  }
  textarea { width:100%; min-height:5rem; font-family:monospace; font-size:.75rem; }
  #direction { flex:1; min-width:220px; }
  input[type=number] { width:7rem; }
  button {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:.35rem .75rem; font-size:.8rem; cursor:pointer;
  }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:#1e4068; border-color:var(--accent); color:var(--accent); font-weight:600; }

  #status { font-size:.8rem; color:var(--muted); min-height:1.2rem; margin:.4rem 0 .8rem; }
  #status.err { color:var(--bad); }

  #history { display:flex; gap:.3rem; flex-wrap:wrap; margin-bottom:.6rem; }
  #history button { font-size:.72rem; padding:.2rem .5rem; }
  #history button.on { border-color:var(--accent); color:var(--accent); }

  #grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:.6rem; }
  .cell { background:var(--panel); border:2px solid var(--line); border-radius:6px; padding:.4rem; cursor:pointer; }
  .cell.sel { border-color:var(--accent); }
  .cell canvas { width:100%; aspect-ratio:1; display:block; border-radius:4px; background:#101216; }
  .cell-name { font-size:.75rem; font-family:monospace; margin:.3rem 0 .25rem; overflow:hidden;
               text-overflow:ellipsis; white-space:nowrap; }
  .cell-actions { display:flex; gap:.25rem; flex-wrap:wrap; }
  .cell-actions button { font-size:.68rem; padding:.15rem .4rem; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🧬 VFX Breed</h1>
    <span id="badge-advisor" class="badge">方向指示: …</span>
    <span id="badge-particle" class="badge">particle: off</span>
  </header>

  <fieldset>
    <legend>起点</legend>
    <div class="row">
      <select id="seed-source"></select>
      <button id="start-btn" class="primary">起点から始める</button>
    </div>
    <textarea id="seed-json" placeholder="ParticleEffectConfig の JSON を貼り付け (vfx-suggest の生成結果など)" hidden></textarea>
  </fieldset>

  <fieldset>
    <legend>次の世代</legend>
    <div class="row">
      <input id="direction" type="text" placeholder="方向 (任意・自由文。例: もっと鋭く短く)">
    </div>
    <div class="row">
      <label>変異の強さ <input id="strength" type="range" min="0" max="0.5" step="0.01" value="0.15"> <span id="strength-val">0.15</span></label>
      <label>体数 <input id="count" type="number" min="4" max="16" value="8"></label>
      <label>seed <input id="seed" type="number" placeholder="空なら乱数"></label>
      <button id="next-btn" class="primary" disabled>選んだ個体から次世代</button>
    </div>
  </fieldset>

  <div id="status"></div>
  <div id="history"></div>
  <div id="grid"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
