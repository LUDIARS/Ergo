# Excubitor catalog fragment (per-repo) -- Ergo
#
# Ergo Studio = C++ のネイティブアプリ build/studio/ergo_studio.exe
# (spec/feature/tool/studio.md、spec/plan/2026-11-05-ergo-studio-native.md)。
# 窓は GLFW + Vulkan + Pictor UIRenderer、ゲーム側の接続口は PORT (既定 5170)。
# 起動は Excubitor 経由に限る (worktree / 複製フォルダからは起動しない)。
# deploy (update) 時は build_command で Pictor (pin) 込みで構成・ビルドし直す
# (Vulkan SDK が必要)。GUI なので自動起動・自動 respawn はしない。
services:
  - code: ergo-studio
    name: Ergo Studio (統合環境アプリ)
    description: LUDIARS のサービスと連携してゲームを AI と作る Ergo のデスクトップアプリ (C++ ネイティブ)。
    tier: local-app
    project_code: Eg
    component: desktop
    repo: LUDIARS/Ergo
    runtime: app
    app_kind: native
    cwd: ${ARS_ROOT}/Ergo
    exec: ${ARS_ROOT}/Ergo/build/studio/ergo_studio.exe
    build_command: cmake -S . -B build -DERGO_PACKAGES=pictor -DERGO_PACKAGES_FETCH=ON && cmake --build build --config Release --target ergo_studio
    env:
      # Pictor の FontLoader が TTC (meiryo.ttc) を読めない間の暫定 (Actio f127eb73)。
      # 直ったらこの行を消し、既定の <Windows>\Fonts\meiryo.ttc に戻す。
      ERGO_STUDIO_FONT: C:/Windows/Fonts/NotoSansJP-VF.ttf
    autostart: false
    restart_policy: 'no'
    health:
      type: process
