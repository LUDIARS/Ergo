name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build `
            -DERGO_BUILD_TESTS=ON `
            -DERGO_AUDIO_BACKEND=dummy

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  # W7: Core of the Unity package (unity/com.ludiars.ergo.packages) without Unity. The package structure and the
  # Fixtures byte match run in ctest above (test_unity_package_structure).
  unity-package-core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test tests/unity_packages/Ergo.Packages.Core.Tests.csproj
